<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    #graph { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="graph"></div>

  <script>
    // Streamlit component communication
    function sendToStreamlit(data) {
      window.parent.postMessage(
        { type: "streamlit:setComponentValue", value: data },
        "*"
      );
    }

    function setFrameHeight(h) {
      window.parent.postMessage(
        { type: "streamlit:setFrameHeight", height: h },
        "*"
      );
    }

    let network = null;
    let currentArgs = null;

    function renderGraph(args) {
      currentArgs = args;
      const nodesData = args.nodes || [];
      const edgesData = args.edges || [];
      const savedPositions = args.positions || {};
      const graphHeight = args.height || 800;

      document.getElementById("graph").style.height = graphHeight + "px";
      setFrameHeight(graphHeight);

      const nodes = new vis.DataSet(
        nodesData.map(function (n) {
          const pos = savedPositions[n.id];
          const node = {
            id: n.id,
            label: n.label,
            color: {
              background: n.color,
              border: n.border_color || n.color,
              highlight: { background: "#F5A623", border: "#F5A623" },
              hover: { background: "#F5A623", border: "#F5A623" },
            },
            title: n.title || "",
            shape: "dot",
            size: n.size || 30,
            font: { size: 14, color: "#222222", face: "Arial" },
            level: n.level,
          };
          if (pos && pos.x !== undefined && pos.y !== undefined) {
            node.x = pos.x;
            node.y = pos.y;
            node.fixed = { x: false, y: false };
          }
          return node;
        })
      );

      const edges = new vis.DataSet(
        edgesData.map(function (e) {
          return {
            from: e.from,
            to: e.to,
            arrows: "to",
            color: { color: "#848484", highlight: "#F5A623" },
            smooth: { type: "cubicBezier", forceDirection: "vertical" },
          };
        })
      );

      const container = document.getElementById("graph");

      const hasSavedPositions = Object.keys(savedPositions).length > 0;

      const options = {
        layout: hasSavedPositions
          ? { randomSeed: 1 }
          : {
              hierarchical: {
                enabled: true,
                direction: "UD",
                sortMethod: "directed",
                levelSeparation: 120,
                nodeSpacing: 200,
                treeSpacing: 250,
              },
            },
        physics: {
          enabled: false,
        },
        interaction: {
          dragNodes: true,
          dragView: true,
          zoomView: true,
          hover: true,
          tooltipDelay: 200,
        },
        nodes: {
          borderWidth: 2,
          shadow: true,
        },
        edges: {
          width: 2,
        },
      };

      if (network) {
        network.destroy();
      }

      network = new vis.Network(container, { nodes: nodes, edges: edges }, options);

      // After stabilization (initial layout done), capture auto-positions
      // if no saved positions exist
      network.once("stabilizationIterationsDone", function () {
        network.fit();
      });

      network.once("afterDrawing", function () {
        // Fit view after first render
        setTimeout(function () {
          network.fit({ animation: false });
        }, 100);
      });

      // On node click
      network.on("click", function (params) {
        if (params.nodes.length > 0) {
          sendToStreamlit({
            event: "click",
            node_id: params.nodes[0],
          });
        }
      });

      // On drag end — save positions
      network.on("dragEnd", function (params) {
        if (params.nodes.length > 0) {
          const positions = network.getPositions();
          sendToStreamlit({
            event: "positions_changed",
            positions: positions,
          });
        }
      });
    }

    // Listen for Streamlit render events
    window.addEventListener("message", function (event) {
      if (event.data.type === "streamlit:render") {
        renderGraph(event.data.args);
      }
    });

    // Tell Streamlit we're ready
    window.parent.postMessage({ type: "streamlit:componentReady" }, "*");
  </script>
</body>
</html>
