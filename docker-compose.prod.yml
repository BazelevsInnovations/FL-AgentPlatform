services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: fl_platform
      POSTGRES_USER: fl_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fl_user -d fl_platform"]
      interval: 5s
      retries: 5

  api:
    build: .
    restart: always
    command: >
      sh -c "alembic upgrade head &&
             uvicorn fl_platform.main:app --host 0.0.0.0 --port 8000"
    environment:
      FL_DATABASE_URL: postgresql+asyncpg://fl_user:${POSTGRES_PASSWORD}@db:5432/fl_platform
      FL_ANTHROPIC_API_KEY: ${FL_ANTHROPIC_API_KEY}
      FL_OPENAI_API_KEY: ${FL_OPENAI_API_KEY}
      FL_FAL_API_KEY: ${FL_FAL_API_KEY}
      FL_DEFAULT_LLM_PROVIDER: ${FL_DEFAULT_LLM_PROVIDER:-claude}
      FL_DEBUG: "false"
      FL_ARTIFACTS_DIR: /app/artifacts
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import httpx; httpx.get(\"http://localhost:8000/health\").raise_for_status()'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:8000:8000"

  streamlit:
    build: .
    restart: always
    command: >
      streamlit run streamlit_app/app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      api:
        condition: service_healthy
      streamlit:
        condition: service_started

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt

volumes:
  pgdata:
  artifacts:
  certbot-etc:
  certbot-var:
